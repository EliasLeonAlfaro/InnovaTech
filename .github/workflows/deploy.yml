name: CI/CD Innovatech(Docker Hub + EC2)

# El pipeline se activará automáticamente cada vez que hagas un push a la rama deploy
on:
  push:
    branches: [ "deploy" ]

jobs:
  # ==========================================
  # TRABAJO 1: COMPILACIÓN Y CONSTRUCCIÓN (CI)
  # ==========================================
  build-and-push:
    name: Construir imágenes y subir a Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Construir y subir Frontend (Puerto 80)
      - name: Build & Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest ./front_despacho
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest

      # 2. Construir y subir Backend Ventas (Puerto 8086)
      - name: Build & Push Backend Ventas
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas:latest ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas:latest

      # 3. Construir y subir Backend Despachos (Puerto 8085)
      - name: Build & Push Backend Despachos
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest

  # ==========================================
  # TRABAJO 2: DESPLIEGUE DISTRIBUIDO VÍA AWS SSM
  # ==========================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ------------------------------------------
      # 1. DESPLIEGUE DE LA BASE DE DATOS (CORREGIDO)
      # ------------------------------------------
      - name: Deploy Database via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_DB_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'docker stop db-innovatech || true',
              'docker rm db-innovatech || true',
              'docker run -d --name db-innovatech -p 3306:3306 -v db_data:/var/lib/mysql -e MYSQL_ROOT_PASSWORD=root_password -e MYSQL_DATABASE=db_innovatech mysql:8.0'
            ]"

      # ------------------------------------------
      # 2. DESPLIEGUE DE LOS BACKENDS (VARIABLES LIMPIAS)
      # ------------------------------------------
      - name: Deploy Backends via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_BACKEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'echo \"${{ secrets.DOCKERHUB_TOKEN }}\" | docker login -u \"${{ secrets.DOCKERHUB_USERNAME }}\" --password-stdin',
              'docker pull ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest',
              'docker pull ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas:latest',
              'docker stop back-despachos back-ventas || true',
              'docker rm back-despachos back-ventas || true',
              'docker network create backend-net || true',
              'docker run -d --name back-despachos --network backend-net -p 8085:8085 -e SERVER_PORT=8085 -e SPRING_DATASOURCE_URL=jdbc:mysql://${{ secrets.IP_PRIVADA_DB }}:3306/db_innovatech -e SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_ALLOWPUBLICKEYRETRIEVAL=true -e SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_USESSL=false -e DB_USERNAME=root -e DB_PASSWORD=root_password --restart always ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest',
              'docker run -d --name back-ventas --network backend-net -p 8086:8086 -e SERVER_PORT=8086 -e SPRING_DATASOURCE_URL=jdbc:mysql://${{ secrets.IP_PRIVADA_DB }}:3306/db_innovatech -e SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_ALLOWPUBLICKEYRETRIEVAL=true -e SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_USESSL=false -e DB_USERNAME=root -e DB_PASSWORD=root_password --restart always ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas:latest',
              'docker image prune -f'
            ]"

      # ------------------------------------------
      # 3. DESPLIEGUE DEL FRONTEND + REVERSE PROXY
      # ------------------------------------------
      - name: Deploy Frontend via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_FRONTEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'echo \"${{ secrets.DOCKERHUB_TOKEN }}\" | docker login -u \"${{ secrets.DOCKERHUB_USERNAME }}\" --password-stdin',
              'docker pull ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest',
              'docker stop frontend-despacho api-proxy || true',
              'docker rm frontend-despacho api-proxy || true',
              'docker network create frontend-net || true',
              'docker run -d --name frontend-despacho --network frontend-net -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/front-despacho:latest',
              'echo \"server { listen 8085; location / { proxy_pass http://${{ secrets.IP_PRIVADA_BACKEND }}:8085; proxy_http_version 1.1; } } server { listen 8086; location / { proxy_pass http://${{ secrets.IP_PRIVADA_BACKEND }}:8086; proxy_http_version 1.1; } }\" > /tmp/proxy.conf',
              'docker run -d --name api-proxy --network frontend-net -p 8085:8085 -p 8086:8086 -v /tmp/proxy.conf:/etc/nginx/conf.d/default.conf nginx:alpine',
              'docker image prune -f'
            ]"